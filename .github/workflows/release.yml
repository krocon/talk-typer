# Release for Talk Typer (structure taken over from comic-commander-tauri).
# Builds installable packages for macOS (universal .dmg/.app, signed + notarised when the secrets
# exist), Windows (.msi + NSIS .exe) and Linux (.deb, .rpm, .AppImage) with tauri-apps/tauri-action
# and attaches them to a DRAFT GitHub release. Nothing is published automatically.
#
# Triggers: manually (Actions → Release → Run workflow) or by pushing a tag `v*` that matches the
# version in package.json. Secrets and signing: docs/release.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write # create the (draft) release and upload assets

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches package.json
        id: v
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Oldest supported Ubuntu runner → AppImage/deb also work on older glibc
          - platform: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust_targets: ''
          - platform: windows-latest
            args: --bundles msi,nsis
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev rpm

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      # --- Windows code signing (optional) -------------------------------------------------------
      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue @{} -Force
          $conf.bundle.windows.certificateThumbprint = $cert.Thumbprint
          $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      # --- macOS signing + notarisation (Developer ID, like Files and Folders) --------------------
      # Only non-empty secrets are exported; without them the .dmg/.app is unsigned.
      - name: macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
            chmod 600 "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Talk Typer v__VERSION__
          releaseBody: |
            Lokale Spracherkennung mit Whisper – Audio und Text verlassen das Gerät nicht.
            Downloads: macOS (universal .dmg), Windows (.msi / .exe), Linux (.AppImage / .deb / .rpm).
            Browser-Version: https://krocon.github.io/talk-typer/
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: ${{ startsWith(needs.check.outputs.version, '0.') }}
          args: ${{ matrix.args }}
