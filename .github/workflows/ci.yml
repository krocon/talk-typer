# CI for Talk Typer (structure taken over from comic-commander-tauri).
# Frontend + WASM on Linux; Rust fmt/clippy/test on Linux, macOS (Metal) and Windows.
# Tests that need a downloaded Whisper model are #[ignore]d and do not run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC – catches new toolchain/clippy warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend + WASM (format, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: cargo clippy -p stt-core -p stt-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - run: pnpm build # desktop + web (web runs `pnpm wasm`)

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false # see every platform's errors, not only the first
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Debug builds use Tauri's dev mode (devUrl), so no frontend build is needed here.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
