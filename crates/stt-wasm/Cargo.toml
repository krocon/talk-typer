[package]
name = "stt-wasm"
description = "wasm-bindgen wrapper around stt-core for the browser (runs in a Web Worker)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stt-core.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.100"

[lints]
workspace = true

# wasm-opt must know the features rustc emits (the target_features section is stripped in release).
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-reference-types",
    "--enable-multivalue",
]
